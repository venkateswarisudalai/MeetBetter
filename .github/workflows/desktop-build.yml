# Builds the desktop app on macOS, Windows, and Linux for every push and PR.
# Windows and Linux builds are uploaded as artifacts (installers). On those platforms the app
# transcribes the microphone only for now; hearing the other side of a call is macOS-only.
name: Desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
          - name: macOS
            os: macos-latest
            bundles: none # tests only; the signed universal DMG is built with scripts/sign-and-package.sh
    runs-on: ${{ matrix.os }}
    env:
      # Google Calendar and cloud sync are baked in at compile time (see src-tauri/build.rs).
      # Unset secrets (forks, PRs) build fine with those two features disabled.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installers
        if: matrix.bundles != 'none'
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        if: matrix.bundles != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: MeetBetter-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
